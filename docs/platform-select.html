<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选择比价平台 · material-price-audit</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --text: #1a2332; --muted: #5a6a7a;
      --line: #e2e8f0; --blue: #1a5fb4; --green: #1b7f4e;
    }
    body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 14px 0; }
    label.row {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 10px; border-bottom: 1px solid var(--line); cursor: pointer;
    }
    label.row:last-child { border-bottom: 0; }
    label.row strong { display: block; }
    label.row small { color: var(--muted); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button, .btn {
      border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
      background: var(--blue); color: #fff; font-size: 14px;
    }
    button.secondary { background: #334155; }
    pre {
      background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 10px;
      overflow: auto; font-size: 12px; white-space: pre-wrap;
    }
    .ok { color: var(--green); font-weight: 600; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>勾选比价平台（可多选）</h1>
    <p>顺序 = 优先级：先勾的平台作为 A，匹配到「详情页规格/型号」才用；否则自动试下一个。</p>

    <div class="card" id="list"></div>

    <div class="btns">
      <button type="button" id="btnAll">全选造价站+电商</button>
      <button type="button" id="btnCost" class="secondary">仅造价三站</button>
      <button type="button" id="btnClear" class="secondary">清空</button>
      <button type="button" id="btnGen">生成命令并复制</button>
    </div>

    <div class="card">
      <div class="ok" id="status">尚未生成</div>
      <p class="hint">把下面内容保存为 <code>data/output/platforms.selected</code>（一行一个或逗号分隔），然后执行一键 run。</p>
      <pre id="out"># 在此生成</pre>
      <pre id="cmd"># 命令</pre>
    </div>
  </div>
  <script>
    const PLATS = [
      { id: "guangcai", name: "广材网", desc: "gldjc.com · 登录 https://www.gldjc.com/login", cost: true },
      { id: "huixun", name: "慧讯网", desc: "登录 https://services.iccchina.com/login （非广材）", cost: true },
      { id: "lingcai", name: "领材网", desc: "登录 https://www.hylcw.cn/userInfo/index.html （非广材）", cost: true },
      { id: "jcnet", name: "建材在线", desc: "jc.net.cn 建材信息价", cost: true },
      { id: "gldjc_hangqing", name: "广材行情", desc: "hangqing.gldjc.com", cost: true },
      { id: "gldjc_xunjia", name: "广材询价", desc: "xunjia.gldjc.com 人工询价", cost: true },
      { id: "jd", name: "京东", desc: "jd.com", cost: false },
      { id: "1688", name: "1688", desc: "1688.com", cost: false },
      { id: "zkh", name: "震坤行", desc: "zkh.com", cost: false },
      { id: "taobao", name: "淘宝", desc: "taobao.com", cost: false },
      { id: "tmall", name: "天猫", desc: "tmall.com", cost: false },
      { id: "suning", name: "苏宁", desc: "suning.com", cost: false },
      { id: "mysteel", name: "我的钢铁网", desc: "mysteel.com", cost: false },
    ];
    const list = document.getElementById("list");
    PLATS.forEach((p, i) => {
      const lab = document.createElement("label");
      lab.className = "row";
      const checked = ["guangcai", "huixun", "lingcai", "jd", "1688"].includes(p.id);
      lab.innerHTML = `<input type="checkbox" value="${p.id}" ${checked ? "checked" : ""}>
        <span><strong>${i + 1}. ${p.name}</strong> <code>${p.id}</code><br><small>${p.desc}</small></span>`;
      list.appendChild(lab);
    });
    function selected() {
      return [...list.querySelectorAll("input:checked")].map((x) => x.value);
    }
    function setOnly(pred) {
      list.querySelectorAll("input").forEach((inp) => {
        const p = PLATS.find((x) => x.id === inp.value);
        inp.checked = pred(p);
      });
    }
    document.getElementById("btnAll").onclick = () => setOnly(() => true);
    document.getElementById("btnCost").onclick = () => setOnly((p) => p.cost);
    document.getElementById("btnClear").onclick = () => setOnly(() => false);
    document.getElementById("btnGen").onclick = async () => {
      const ids = selected();
      if (!ids.length) {
        alert("请至少勾选一个平台");
        return;
      }
      const fileBody = ids.join("\n");
      const platforms = ids.join(",");
      const cmd = `python -m material_price_audit run \\
  --platforms ${platforms} \\
  --auto-install \\
  --login-wait 90`;
      document.getElementById("out").textContent = fileBody;
      document.getElementById("cmd").textContent = cmd;
      document.getElementById("status").textContent =
        "已生成 " + ids.length + " 个平台（顺序=优先级 A→B→C）";
      try {
        await navigator.clipboard.writeText(cmd);
        document.getElementById("status").textContent += " · 命令已复制";
      } catch (e) {}
    };
  </script>
</body>
</html>

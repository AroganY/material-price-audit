[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "material-price-audit"
dynamic = ["version"]
description = "Construction material inquiry price audit with Playwright evidence (accuracy-first)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Material Price Audit Contributors" }]
keywords = ["construction", "cost", "pricing", "playwright", "excel", "inquiry"]
dependencies = [
  "openpyxl>=3.1.0",
  "playwright>=1.40.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.0",
]

[project.scripts]
material-price-audit = "material_price_audit.cli:main"

[project.urls]
Homepage = "https://github.com/AroganY/material-price-audit"
Repository = "https://github.com/AroganY/material-price-audit"
Issues = "https://github.com/AroganY/material-price-audit/issues"

[tool.setuptools.packages.find]
include = ["material_price_audit*"]

[tool.setuptools.dynamic]
version = { attr = "material_price_audit.__version__" }

[tool.setuptools.package-data]
"material_price_audit.webapp" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

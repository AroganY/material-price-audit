# cp config.example.yaml config.yaml

pricing:
  tax_divisor: 1.13
  never_exceed_submit: true
  open_detail: true
  min_title_score: 1
  platform_strategy: waterfall
  detail_match_min_score: 0.55

browser:
  channel: chrome
  headless: false
  # 登录自动检测的超时上限（秒）；检测到成功立刻继续，不会固定傻等
  login_timeout_seconds: 180
  login_wait_seconds: 180  # 兼容旧字段，同 timeout
  page_timeout_ms: 60000
  between_items_sleep: 1.2

platforms:
  # 空 = 尚未选择。请先：
  #   python -m material_price_audit select-platforms
  # 或 run --platforms guangcai,jd
  # 登录页只会打开你选的站。
  enabled: []
  # 示例（用户选完后才会有内容）：
  # enabled:
  #   - guangcai     # 登录 https://www.gldjc.com/login
  #   - huixun       # 登录 https://services.iccchina.com/login
  #   - lingcai      # 登录 https://www.hylcw.cn/userInfo/index.html
  #   - jd
  definitions: {}

excel:
  submit_price_headers: [报送不含税单价, 报送单价, 投标单价]
  audit_price_headers: [审定不含税单价, 审定单价]
  name_headers: [材料名称, 名称, 设备名称]
  spec_headers: [规格、型号, 规格型号, 规格, 型号]
  unit_headers: [单位]
  qty_headers: [数量]
  brand_headers: [产地、品牌及特殊要求, 品牌, 产地品牌]

# cp config.example.yaml config.yaml

pricing:
  tax_divisor: 1.13
  never_exceed_submit: true
  min_title_score: 1

inquiry:
  quotes_per_item: 3
  # side_sheet | append_cols | both
  write_back_mode: side_sheet

# 默认关闭；开启后只辅助陌生表头和语义灰区，不参与定价或放宽硬规格
llm:
  enabled: false
  api_base: ""   # 兼容 OpenAI 协议，如 https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  use_for: [schema, match_review]

browser:
  channel: chrome
  headless: false
  login_timeout_seconds: 180
  page_timeout_ms: 60000
  between_items_sleep: 1.2

platforms:
  # 平台和优先级由浏览器向导保存；这里仅作为首次运行的可选预设。
  enabled: []
  # 可选的通用平台定义，格式见 docs/PLATFORMS.md。
  definitions: {}

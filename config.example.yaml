# cp config.example.yaml config.yaml

pricing:
  tax_divisor: 1.13
  never_exceed_submit: true
  open_detail: true
  min_title_score: 1
  platform_strategy: waterfall
  detail_match_min_score: 0.55

browser:
  channel: chrome
  headless: false
  login_wait_seconds: 120
  page_timeout_ms: 60000
  between_items_sleep: 1.2

platforms:
  # 三家造价信息站域名互不相同，登录页会分别打开（不会串成广材）
  enabled:
    - guangcai     # 广材网 https://www.gldjc.com/
    - huixun       # 慧讯网 https://services.iccchina.com/apply_trial （RCC，非广材）
    - lingcai      # 领材网 https://www.hylcw.cn/lcIndex.html （hylcw.cn，非广材）
    - jd
    - "1688"
    # - jcnet      # 建材在线 https://www.jc.net.cn/
    # - gldjc_hangqing
    # - gldjc_xunjia

  definitions:
    # 内置 URL 已写在 platforms.py；仅当官网变更时才覆盖，例如：
    # huixun:
    #   login_url: "https://services.iccchina.com/apply_trial"
    #   search_url: "https://services.iccchina.com/iccHome"
    # lingcai:
    #   login_url: "https://www.hylcw.cn/lcIndex.html"
    #   search_url: "https://www.hylcw.cn/lcIndex.html?keyword={query}"

excel:
  submit_price_headers: [报送不含税单价, 报送单价, 投标单价]
  audit_price_headers: [审定不含税单价, 审定单价]
  name_headers: [材料名称, 名称, 设备名称]
  spec_headers: [规格、型号, 规格型号, 规格, 型号]
  unit_headers: [单位]
  qty_headers: [数量]
  brand_headers: [产地、品牌及特殊要求, 品牌, 产地品牌]
